name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Show formatting differences
        run: gofmt -d internal/api/client_test.go internal/api/current_posts.go internal/api/current_posts_test.go
      - name: Run tests
        run: go test ./...
      - name: Go vet
        run: go vet ./...
